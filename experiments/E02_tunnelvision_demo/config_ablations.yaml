# E02 ablations — depolarizing noise + surrogate-quality sweeps.
# Exact tier. Global-λ model at p=10; Aer per-gate check at p=6.
# Question: where does the (already-losing) quench/ADS gap die?
prior_inclusion: 0.5
noise_levels: [0.0, 0.001, 0.005, 0.02, 0.1]
surrogate_sigmas: [0.0, 0.25, 0.5, 1.0, 2.0, 4.0]
datasets:
  - name: diabetes
  - name: synthetic
    n: 120
    p: 10
    rho: 0.9
    k_true: 3
    snr: 2.0
    seed: 0
    structure: equicorrelated
quench:
  evolution: exact
  n_gamma: 4
  n_t: 4
  gamma_range: [0.25, 0.6]
  t_range: [2.0, 20.0]
  trotter_dt: 0.8
learned:
  n_samples: 2000
  seed: 0
  ridge: 0.001
chain:
  n_steps: 4000
  burn_in: 500
  seed: 0
aer_validation:
  enabled: true
  p: 6
  n: 80
  rho: 0.5
  k_true: 2
  snr: 3.0
  seed: 1
  n_gamma: 2
  n_t: 2
  gate_errors: [0.0, 0.005, 0.02]
output_dir: results/E02/ablations
