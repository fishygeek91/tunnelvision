# E02b — ρ-sweep, exact tier at p=10.
# Question: does the quench/ADS gap ratio grow with predictor correlation?
# Sampled tier (p=20–27) is a later session; this file is the enumerable story.
rhos: [0.0, 0.3, 0.5, 0.7, 0.9]
prior_inclusion: 0.5
kernels:
  - uniform
  - single-flip
  - add-delete-swap
  - quench-analytic
  - quench-learned
synthetic:
  n: 120
  p: 10
  k_true: 3
  snr: 2.0
  seed: 0
  structure: equicorrelated
quench:
  evolution: exact
  n_gamma: 4
  n_t: 4
  gamma_range: [0.25, 0.6]
  t_range: [2.0, 20.0]
  trotter_dt: 0.8
learned:
  n_samples: 2000
  seed: 0
  ridge: 0.001
chain:
  n_steps: 6000
  burn_in: 1500
  n_chains: 4
  seed: 0
output_dir: results/E02/rho_sweep
