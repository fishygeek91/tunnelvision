# E03 — Maxwell's Daemon, phase 1 (simulator, exact tier).
# Question: does a fixed noise ladder mix faster than its best
# single rung, and does noise heat the proposal? Parallel tempering
# is the third arm (config_pt.yaml / run_pt.py).
prior_inclusion: 0.5
noise_levels: [0.0, 0.001, 0.005, 0.02, 0.1]
datasets:
  - name: diabetes
  - name: synthetic
    n: 120
    p: 10
    rho: 0.9
    k_true: 3
    snr: 2.0
    seed: 0
    structure: equicorrelated
quench:
  evolution: exact
  n_gamma: 4
  n_t: 4
  gamma_range: [0.25, 0.6]
  t_range: [2.0, 20.0]
  trotter_dt: 0.8
learned:
  n_samples: 2000
  seed: 0
  ridge: 0.001
chain:
  n_steps: 4000
  burn_in: 500
  seed: 0
temperature:
  n_samples: 4000
  seed: 0
output_dir: results/E03
