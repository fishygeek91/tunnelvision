# E03 — symmetric-q bias audit (methodology, not a QPU result).
# Amplitude damping is non-unital, so q(y|x)=q(x|y) is an approximation.
# This runner bounds the residual vs the enumerated posterior.
# Full cell: p=10 diabetes. --quick drops to p=5 synthetic.
prior_inclusion: 0.5
damping: 0.05
pool_size: 8
datasets:
  - name: diabetes
quench:
  evolution: trotter
  n_gamma: 4
  n_t: 4
  gamma_range: [0.25, 0.6]
  t_range: [2.0, 20.0]
  trotter_dt: 0.8
learned:
  n_samples: 2000
  seed: 0
  ridge: 0.001
chain:
  n_chains: 4
  n_steps: 2000
  burn_in: 400
  seed: 0
output_dir: results/E03/bias_audit
