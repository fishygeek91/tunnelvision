[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunnelvision"
version = "0.0.1"
description = "Exact Bayesian variable selection with quantum tunneling proposals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fishygeek91" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.5", "mypy>=1.10", "jupyter"]
hardware = ["qiskit-ibm-runtime>=0.28"]

[tool.hatch.build.targets.wheel]
packages = ["src/tunnelvision"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
